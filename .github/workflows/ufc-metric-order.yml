name: UFC metric call-site audit
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths: ["src/wshlx_ufc/grading.py","tools/audit_metric_order.py",".github/workflows/ufc-metric-order.yml","tests/test_grading_class_order.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_grading_class_order.py tests/test_core.py
      - run: python tools/audit_metric_order.py
      - uses: actions/upload-artifact@v4
        with:
          name: metric-order-call-inventory
          path: metric_call_inventory.json
          if-no-files-found: error
