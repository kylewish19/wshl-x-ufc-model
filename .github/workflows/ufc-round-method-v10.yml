name: UFC round and submission method v10 research
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths:
      - "src/wshlx_ufc/round_method_v10.py"
      - "tools/benchmark_round_method_v10.py"
      - "tests/test_ufc_round_method_v10.py"
      - ".github/workflows/ufc-round-method-v10.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Check past-only round and conversion feature invariants
        run: pytest -q tests/test_ufc_round_method_v10.py tests/test_ufc_finish_conversion_v9.py
      - name: Run chronological fixed-winner submission and round model comparisons
        run: |
          set -o pipefail
          python tools/benchmark_round_method_v10.py | tee round_v10_stdout.log
      - name: Verify cohort sizes, fixed winners, frozen original sources and forecast integrity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("reports/model_health/2026-11-24_round_method_v10")
          a=json.loads((p/"round_v10_results.json").read_text())
          assert a["no_model_promotion"] and a["same_v3_winner_probabilities_for_all_arms"]
          assert a["round_source_audit"]["bouts_with_first_two_full_rounds"]>=1000
          assert [a["yearly"][y]["test_n"] for y in ("2024","2025","2026_retrospective")]==[511,513,488]
          assert a["forecast_sha256"]==hashlib.sha256((p/"round_v10_paired_forecasts.csv").read_bytes()).hexdigest()
          for y in a["yearly"].values():
              assert len(y["scores"])==7
              assert len({v["winner_hits"] for v in y["scores"].values()})==1
          d=json.loads(Path("data/grades/ufcqatar_2026_11_21_all_frozen_models_and_public_card_grade.json").read_text())
          for name,sha in d["frozen_source_hashes"].items():
              source=Path("data/locks/ufcqatar_2026-11-21" if name=="stage_a_final_selection.json" else "data/shadow_locks/ufcqatar_2026-11-21")/name
              assert hashlib.sha256(source.read_bytes()).hexdigest()==sha
          print("ROUND_METHOD_RESEARCH_VERIFIED_ORIGINAL_LOCKS_UNCHANGED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wshlx-nov24-round-method-v10
          path: |
            reports/model_health/2026-11-24_round_method_v10/
            round_v10_stdout.log
          if-no-files-found: warn
