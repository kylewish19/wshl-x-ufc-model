name: integrate-ufc333-full-stats
on:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/integrate_ufc333_full_stats.py"
      - ".github/workflows/integrate-ufc333-full-stats.yml"
      - "data/raw/ufc333_2026-10-24/availability.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-ufc333-full-stats
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integrate causal full stats and compare method challengers
        run: PYTHONPATH=src python tools/integrate_ufc333_full_stats.py
      - name: Test
        run: pytest -q
      - name: Save audit and future shadow artifacts
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results/clean_ufc_139_2026-10-24.csv \
            data/results/ufc333_2026-10-24_fighter_fight_stats.csv \
            artifacts/ufc333_post_event_shadow \
            reports/ufc333_2026-10-24/full_stats
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "model: integrate UFC333 full stats; benchmark method challengers"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
