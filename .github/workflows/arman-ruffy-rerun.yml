name: arman-ruffy-rerun

on:
  push:
    paths:
      - "arman_ruffy_rerun_request.json"
      - "tools/rerun_arman_ruffy.py"
      - ".github/workflows/arman-ruffy-rerun.yml"

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run isolated Arman-Ruffy recheck
        run: PYTHONPATH=src python tools/rerun_arman_ruffy.py
      - name: Test
        run: pytest -q
      - name: Save rerun report
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ufc331_2026-09-19/arman_ruffy_isolated_rerun.json
          git commit -m "report: save Arman-Ruffy isolated rerun"
          git fetch origin main
          git rebase origin/main || true
          git push || true
