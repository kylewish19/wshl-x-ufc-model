name: Audit UFC Vegas124 full FanDuel Stage B
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "data/quotes/ufcvegas124_2026-11-07_fanduel_user_screenshots.json"
      - "tools/audit_ufcvegas124_fanduel_stage_b.py"
      - ".github/workflows/audit-ufcvegas124-fanduel-stage-b.yml"
permissions:
  contents: write
concurrency:
  group: audit-ufcvegas124-fanduel-stage-b
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compare all 14 FanDuel screenshot price sets and do not force weak bets
        run: PYTHONPATH=src:tools python tools/audit_ufcvegas124_fanduel_stage_b.py
      - name: Regression tests
        run: pytest -q
      - name: Save full Stage B price audit and separately frozen two-tier outcomes
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/locks/ufcvegas124_2026-11-07/stage_b_fanduel_full_price_audit.json
          git add data/locks/ufcvegas124_2026-11-07/stage_b_two_tier_outcome.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: preserve 364 FanDuel markets and evidence-gated Nov7 Top5 Stage B outcomes"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
