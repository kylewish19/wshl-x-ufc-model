name: Finalize UFC 333 Stage A

on:
  workflow_dispatch:
  push:
    branches:
      - feature/historical-conditional-rates
    paths:
      - "tools/finalize_ufc333_stage_a.py"
      - ".github/workflows/finalize-ufc333-stage-a.yml"

permissions:
  contents: write

concurrency:
  group: finalize-ufc333-stage-a
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Finalize research-audited pre-weigh-in Stage A
        run: PYTHONPATH=src:tools python tools/finalize_ufc333_stage_a.py

      - name: Test
        run: pytest -q

      - name: Record frozen Stage A on research branch
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/locks/ufc333_2026-10-24/stage_a_final_selection.json
          git add data/locks/ufc333_2026-10-24/stage_a_final_audit.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "lock: freeze UFC 333 pre-weigh-in Stage A"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
