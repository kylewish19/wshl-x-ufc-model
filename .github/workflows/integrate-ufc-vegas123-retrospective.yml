name: integrate-ufc-vegas123-retrospective
on:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/integrate_ufcvegas123_retrospective.py"
      - ".github/workflows/integrate-ufc-vegas123-retrospective.yml"
      - "data/raw/ufcvegas123_2026-10-31/availability.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-ufc-vegas123-retrospective
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Rebuild historical state and study unpicked Oct31 outcomes
        run: PYTHONPATH=src python tools/integrate_ufcvegas123_retrospective.py
      - name: Regression tests
        run: pytest -q
      - name: Save retrospective records and shadow training output
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results/ufcvegas123_2026-10-31_retrospective_only.csv \
            data/results/ufcvegas123_2026-10-31_fighter_stats.csv \
            reports/ufcvegas123_2026-10-31/retrospective \
            artifacts/ufcvegas123_post_event_shadow
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "model: learn from Oct31 unpicked event in future shadow only"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
