name: Freeze UFC334 Nov14 13 fight Stage A winner method one timing each
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/finalize_ufc334_2026_11_14_stage_a.py"
      - ".github/workflows/freeze-ufc334-nov14-stage-a.yml"
permissions:
  contents: write
concurrency:
  group: freeze-ufc334-nov14-stage-a
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Freeze 13 prefight winner method and one timing each without odds
        run: PYTHONPATH=src:tools python tools/finalize_ufc334_2026_11_14_stage_a.py
      - name: Regression suite
        run: pytest -q
      - name: Commit immutable Stage A research lock; no price-derived picks
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/locks/ufc334_2026-11-14/stage_a_final_selection.json
          git add data/locks/ufc334_2026-11-14/stage_a_final_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "lock: UFC334 full 13 fight Stage A frozen odds free, 3 models methods and one timing per fight"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
