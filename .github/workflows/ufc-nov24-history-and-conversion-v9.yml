name: UFC postevent history extension and finishing conversion v9
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths:
      - "src/wshlx_ufc/postevent_history_extension_v1.py"
      - "src/wshlx_ufc/finish_conversion_v9.py"
      - "tools/benchmark_finish_conversion_v9.py"
      - "tests/test_ufc_postevent_history_extension_v1.py"
      - "tests/test_ufc_finish_conversion_v9.py"
      - ".github/workflows/ufc-nov24-history-and-conversion-v9.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test future-only extended archive, actual round totals, and conversion feature timing
        run: pytest -q tests/test_ufc_postevent_history_extension_v1.py tests/test_ufc_finish_conversion_v9.py
      - name: Produce paired historical method v9 evaluation holding v3 winners fixed
        run: python tools/benchmark_finish_conversion_v9.py | tee conversion_v9_stdout.log
      - name: Verify all original research source locks and complete matched cohorts
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("reports/model_health/2026-11-24_conversion_method_v9")
          a=json.loads((p/"conversion_v9_results.json").read_text())
          assert a["no_model_promotion"] and a["same_v3_winner_probabilities_for_all_arms"]
          assert [a["yearly"][y]["test_n"] for y in ("2024","2025","2026_retrospective")]==[511,513,488]
          assert a["forecast_sha256"]==hashlib.sha256((p/"conversion_v9_paired_forecasts.csv").read_bytes()).hexdigest()
          for y in a["yearly"].values():
              assert len(y["scores"])==4
              assert len({v["winner_hits"] for v in y["scores"].values()})==1
          d=json.loads(Path("data/grades/ufcqatar_2026_11_21_all_frozen_models_and_public_card_grade.json").read_text())
          for name,sha in d["frozen_source_hashes"].items():
              source=Path("data/locks/ufcqatar_2026-11-21" if name=="stage_a_final_selection.json" else "data/shadow_locks/ufcqatar_2026-11-21")/name
              assert hashlib.sha256(source.read_bytes()).hexdigest()==sha
          print("ARCHIVE_AND_NOV21_FROZEN_SOURCES_PRESERVED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wshlx-nov24-finish-conversion-v9
          path: |
            reports/model_health/2026-11-24_conversion_method_v9/
            conversion_v9_stdout.log
          if-no-files-found: warn
