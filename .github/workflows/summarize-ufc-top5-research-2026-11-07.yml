name: Summarize UFC Top5 research W-L and virtual units through Nov7
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "data/results/ufcvegas124_2026-11-07_top5_research_unit_grade.json"
      - "tools/summarize_ufc_top5_research_units.py"
      - ".github/workflows/summarize-ufc-top5-research-2026-11-07.yml"
permissions:
  contents: write
concurrency:
  group: summarize-ufc-top5-2026-11-07
  cancel-in-progress: true
jobs:
  sum:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compute separate Top5 cumulative W-L, virtual units, ROI
        run: |
          PYTHONPATH=src:tools python tools/summarize_ufc_top5_research_units.py \
            data/results/ufcvegas124_2026-11-07_top5_research_unit_grade.json \
            --output reports/two_tier_tracking/cumulative_hypothetical_research_units_2026-11-07.json
      - name: Regression suite
        run: pytest -q
      - name: Commit post-event historical research cumulative ledger
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/two_tier_tracking/cumulative_hypothetical_research_units_2026-11-07.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "tracking: freeze first Top5 research cumulative odds/units 0-5 and 2-3 after Nov7"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
