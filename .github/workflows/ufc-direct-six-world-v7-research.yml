name: UFC direct six fighter-plus-method v7 enriched model research

on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths:
      - "tools/benchmark_worldwide_direct_six_v7.py"
      - "tests/test_ufc_worldwide_direct_six_v7.py"
      - ".github/workflows/ufc-direct-six-world-v7-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-way-research:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research environment and verify mirrored fighter outcomes
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q tests/test_ufc_worldwide_direct_six_v7.py tests/test_ufc_opponent_matchup_method_v6.py
      - name: Verify exact pinned third-party regional professional source
        run: |
          mkdir -p .research_cache/fightcanon
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 360 \
            --output .research_cache/fightcanon/canon.db \
            https://github.com/Jadevit/fight-canon-db/releases/download/db-2026-11-19-1934/canon.db
          echo '8185a2163b5f97071dbc4ec68667cceb43f5e321fadc38c26b5069303af4d949  .research_cache/fightcanon/canon.db' | sha256sum --check
      - name: Reconstruct time-safe regional histories with two-fighter identity crosswalk
        run: python tools/audit_worldwide_mma_history_v4.py > six_way_source_audit.log
      - name: Train mirrored six-state fighter-method models and evaluate 2024 2025 2026
        run: python tools/benchmark_worldwide_direct_six_v7.py > six_way_v7_execution.log
      - name: Assert valid chronological folds, full outcome list and no model or bet promotion
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('reports/model_health/2026-11-19_direct_six_world_v7')
          r=json.loads((p/'worldwide_direct_six_v7_results.json').read_text())
          assert r['direct_six_only_prior_known_outcomes']
          assert r['prior_year_nested_C_test_year_never_used']
          assert r['no_fighter_method_or_betting_model_promotion']
          assert r['Nov21_all_original_and_research_sidecars_frozen_unchanged']
          assert r['source_professional_MMA_SHA256']=='8185a2163b5f97071dbc4ec68667cceb43f5e321fadc38c26b5069303af4d949'
          assert [r['years'][y]['evaluation_fights'] for y in
                  ('2024','2025','2026_retrospective')]==[511,513,488]
          assert all(len(x['scores'])==8 for x in r['years'].values())
          assert all(len(x['independent_previous_year_6_state_C_tuning'])==2 for x in r['years'].values())
          for year,data in r['years'].items():
              assert all(v['no_test_target_used_to_tune'] and v['past_years_only']
                  for v in data['independent_previous_year_6_state_C_tuning'].values())
              assert all(x['n']==data['evaluation_fights'] for x in data['scores'].values())
          assert hashlib.sha256((p/'worldwide_direct_six_2024_26_forecasts.csv').read_bytes()).hexdigest()==r['outcome_csv_sha256']
          for source in (
            'data/locks/ufcqatar_2026-11-21/stage_a_final_selection.json',
            'data/shadow_locks/ufcqatar_2026-11-21/coherent_joint_pre_event_shadow.json',
            'data/shadow_locks/ufcqatar_2026-11-21/winner_v3_prospective_shadow.json',
            'data/shadow_locks/ufcqatar_2026-11-21/worldwide_winner_v4_prospective_shadow.json',
            'data/shadow_locks/ufcqatar_2026-11-21/worldwide_method_v5_prospective_shadow.json',
          ):
              assert Path(source).exists()
          print('MIRRORED_SIX_EXACT_NEW_ARCHITECTURE_DATE_SAFE_AND_UNPROMOTED')
          PY
      - name: Preserve true per-fight predictions and full six-state score results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wshlx-direct-six-world-v7-full-chronological-research
          path: |
            reports/model_health/2026-11-19_direct_six_world_v7/
            six_way_v7_execution.log
            six_way_source_audit.log
          if-no-files-found: warn
