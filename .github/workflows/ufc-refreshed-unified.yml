name: UFC refreshed Unified composition contract
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths: ["src/wshlx_ufc/refreshed_unified.py","tests/test_refreshed_unified.py",".github/workflows/ufc-refreshed-unified.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_refreshed_unified.py
      - name: Verify frozen Qatar hashes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=json.loads(Path("data/grades/ufcqatar_2026_11_21_all_frozen_models_and_public_card_grade.json").read_text())
          for name,sha in d["frozen_source_hashes"].items():
              p=Path("data/locks/ufcqatar_2026-11-21" if name=="stage_a_final_selection.json" else "data/shadow_locks/ufcqatar_2026-11-21")/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
          PY
