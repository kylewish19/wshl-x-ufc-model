name: wshlx-longitudinal-audit
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths:
      - "src/wshlx_ufc/longitudinal_audit.py"
      - "tools/audit_wshlx_ufc_history.py"
      - "tests/test_ufc_longitudinal_audit.py"
      - ".github/workflows/wshlx-longitudinal-audit.yml"
  workflow_dispatch:
jobs:
  independent-evidence-ledger:
    name: 153 + UFC334 clean grades, Stage A hashes, Stage B scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run source/grade integrity tests
        run: pytest -q tests/test_ufc_longitudinal_audit.py
      - name: Print complete evidence-first audit (zero model writes)
        run: python tools/audit_wshlx_ufc_history.py
