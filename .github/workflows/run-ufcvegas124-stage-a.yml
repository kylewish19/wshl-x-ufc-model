name: UFC Vegas 124 Stage A three-view model raw
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/run_ufcvegas124_stage_a.py"
      - ".github/workflows/run-ufcvegas124-stage-a.yml"
permissions:
  contents: write
concurrency:
  group: run-ufcvegas124-stage-a
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run real Oct31-updated 14-bout model with 10000 simulations and shadow comparisons
        run: PYTHONPATH=src:tools python tools/run_ufcvegas124_stage_a.py
      - name: Test
        run: pytest -q
      - name: Commit model-raw data before any Stage B odds
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/locks/ufcvegas124_2026-11-07/stage_a_model_raw_three_view.json
          git add data/locks/ufcvegas124_2026-11-07/stage_a_model_raw_audit.json
          git add data/locks/ufcvegas124_2026-11-07/stage_a_model_raw_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "model: record Vegas124 odds-blind 14-bout three-view Stage A"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
