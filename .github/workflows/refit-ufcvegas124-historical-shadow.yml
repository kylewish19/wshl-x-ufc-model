name: Refit historical UFC shadow through Nov7 post-event stats
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/refit_ufcvegas124_historical_shadow.py"
      - ".github/workflows/refit-ufcvegas124-historical-shadow.yml"
permissions:
  contents: write
concurrency:
  group: refit-ufcvegas124-historical
  cancel-in-progress: true
jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Refit historical shadow on completed Nov7 full stats with strict chronology
        run: PYTHONPATH=src:tools python tools/refit_ufcvegas124_historical_shadow.py
      - name: Regression suite
        run: pytest -q
      - name: Commit non-promoted model and historical evaluation only
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ufcvegas124_2026-11-07/historical_shadow_refit.json
          git add artifacts/ufcvegas124_post_event_historical
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ML: retrain historical winner research shadow after Nov7 UFCStats, no champion promotion"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
