name: lock-ufcqatar-nov21-coherent-shadow

# MANUAL and research-only. Does not generate Stage A or expose/price odds.
# Invoke only after normal three-view Stage A is frozen for Nov21.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ufcqatar-2026-11-21-independent-coherence-shadow-lock
  cancel-in-progress: false

jobs:
  freeze-research:
    if: github.ref == 'refs/heads/feature/historical-conditional-rates'
    name: Never touch official Stage A/B — lock pre-event joint shadow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install existing model package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Audit pre-lock independence and temporal checks
        run: pytest -q tests/test_ufc_prospective_coherence_lock.py tests/test_ufc_three_event_joint_coherence_shadow.py
      - name: Stop unless original Nov21 Stage A exists and is frozen
        run: |
          test -f data/locks/ufcqatar_2026-11-21/stage_a_model_raw_three_view.json || (echo "STOP: original Stage A raw missing. Run normal Stage A first." && exit 1)
          test -f data/locks/ufcqatar_2026-11-21/stage_a_final_selection.json || (echo "STOP: original frozen Stage A final missing. Lock Stage A first." && exit 1)
      - name: Generate research only before confirmed first fight
        run: |
          python tools/lock_prospective_coherence_shadow.py --event-slug ufcqatar_2026-11-21
      - name: Commit ONLY the standalone research probability lock on this branch
        run: |
          set -euo pipefail
          git config user.name "WSHL_X research-only model bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/shadow_locks/ufcqatar_2026-11-21/coherent_joint_pre_event_shadow.json
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "research-lock: Nov21 three-view coherence shadow pre-event; zero FanDuel bets [run ${GITHUB_RUN_ID}]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
