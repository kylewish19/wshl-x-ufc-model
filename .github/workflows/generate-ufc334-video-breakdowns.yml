name: Generate UFC334 model-grounded video breakdowns
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "src/wshlx_ufc/video_breakdown.py"
      - "tools/generate_ufc_video_breakdowns.py"
      - "tests/test_video_breakdown.py"
      - ".github/workflows/generate-ufc334-video-breakdowns.yml"
permissions:
  contents: write
concurrency:
  group: ufc334-video-breakdown-pack
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regression tests including 13 original locked fights
        run: pytest -q
      - name: Build derived video-research pack without changing Stage A
        run: |
          python tools/generate_ufc_video_breakdowns.py \
            --stage-a data/locks/ufc334_2026-11-14/stage_a_final_selection.json \
            --raw data/locks/ufc334_2026-11-14/stage_a_model_raw_three_view.json \
            --json-out reports/ufc334_2026-11-14/VIDEO_BREAKDOWN_RESEARCH.json \
            --markdown-out reports/ufc334_2026-11-14/VIDEO_BREAKDOWN_RESEARCH.md
      - name: Commit only derived editorial files
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ufc334_2026-11-14/VIDEO_BREAKDOWN_RESEARCH.json
          git add reports/ufc334_2026-11-14/VIDEO_BREAKDOWN_RESEARCH.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "reports: auto-generate UFC334 model-grounded video breakdowns; picks unchanged"
          git pull --rebase origin feature/historical-conditional-rates
          git push origin HEAD:feature/historical-conditional-rates
