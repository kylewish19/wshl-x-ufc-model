name: aswell-yoo-rerun

on:
  push:
    paths:
      - "aswell_yoo_rerun_request.json"
      - "tools/rerun_aswell_yoo.py"
      - ".github/workflows/aswell-yoo-rerun.yml"

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run isolated Aswell-Yoo recheck
        run: PYTHONPATH=src python tools/rerun_aswell_yoo.py
      - name: Test
        run: pytest -q
      - name: Save rerun report
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ufc331_2026-09-19/aswell_yoo_isolated_rerun.json
          git commit -m "report: save Aswell-Yoo isolated rerun"
          git fetch origin main
          git rebase origin/main
          git push
