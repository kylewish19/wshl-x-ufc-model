name: quality-aware-method-shadow

on:
  push:
    branches:
      - feature/historical-conditional-rates
    paths:
      - "src/wshlx_ufc/quality_aware_method_shadow.py"
      - "tools/benchmark_quality_aware_method_shadow.py"
      - ".github/workflows/quality-aware-method-shadow.yml"
  workflow_dispatch:

jobs:
  chronological-research:
    name: Quality-aware conditional method (NO PROMOTION)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run 153-fight chronologically held-out opponent-quality ablation
        run: |
          python tools/benchmark_quality_aware_method_shadow.py
