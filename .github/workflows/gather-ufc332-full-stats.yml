name: gather-ufc332-full-stats
on:
  push:
    paths:
      - "ufc332_stats_request.json"
      - "tools/gather_ufc332_full_stats.py"
      - ".github/workflows/gather-ufc332-full-stats.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gather-ufc332-full-stats
  cancel-in-progress: true
jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Gather
        run: PYTHONPATH=src python tools/gather_ufc332_full_stats.py
      - name: Save
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/ufc332_2026-10-03
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: gather UFC 332 full stats"
          git pull --rebase origin main
          git push
