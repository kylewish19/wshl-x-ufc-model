name: UFC worldwide source refresh audit
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths:
      - "tools/audit_worldwide_refresh_2026_11_25.py"
      - ".github/workflows/ufc-worldwide-refresh-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download two immutable release assets
        run: |
          mkdir -p .research_cache/fightcanon
          cd .research_cache/fightcanon
          curl --fail --silent --show-error --location --retry 2 --max-time 360 --output old.db https://github.com/Jadevit/fight-canon-db/releases/download/db-2026-11-19-1934/canon.db
          curl --fail --silent --show-error --location --retry 2 --max-time 360 --output new.db https://github.com/Jadevit/fight-canon-db/releases/download/db-2026-11-24-2118/canon.db
      - name: Compare sources without generating predictions
        run: python tools/audit_worldwide_refresh_2026_11_25.py
      - name: Verify frozen Qatar sources
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=json.loads(Path("data/grades/ufcqatar_2026_11_21_all_frozen_models_and_public_card_grade.json").read_text())
          for name,sha in d["frozen_source_hashes"].items():
              source=Path("data/locks/ufcqatar_2026-11-21" if name=="stage_a_final_selection.json" else "data/shadow_locks/ufcqatar_2026-11-21")/name
              assert hashlib.sha256(source.read_bytes()).hexdigest()==sha
          print("FROZEN_SOURCE_HASHES_VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worldwide-refresh-audit
          path: reports/model_health/2026-11-25_worldwide_refresh/
          if-no-files-found: error
