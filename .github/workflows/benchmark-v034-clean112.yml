name: benchmark-v034-clean112
on:
  push:
    paths:
      - "tools/benchmark_winner_interactions_v034_clean112.py"
      - ".github/workflows/benchmark-v034-clean112.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: benchmark-v034-clean112
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Benchmark
        run: PYTHONPATH=src python tools/benchmark_winner_interactions_v034_clean112.py
      - name: Test
        run: pytest -q
      - name: Save
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/v034_winner_interactions_clean112
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "model: benchmark v0.34 interactions on clean112"
          git pull --rebase origin main
          git push
