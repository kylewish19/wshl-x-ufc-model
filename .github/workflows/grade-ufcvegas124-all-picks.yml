name: Grade UFC Vegas124 all frozen Stage A and Top5 research picks
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/grade_ufcvegas124_all_locked_picks.py"
      - "data/results/ufcvegas124_2026-11-07_verified_outcomes.json"
      - ".github/workflows/grade-ufcvegas124-all-picks.yml"
permissions:
  contents: write
concurrency:
  group: grade-vegas124-frozen-models-and-top5
  cancel-in-progress: true
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Grade verified 14 fight results without rewriting pre-fight locks
        run: PYTHONPATH=src:tools python tools/grade_ufcvegas124_all_locked_picks.py
      - name: Run full regression suite
        run: pytest -q
      - name: Commit versioned post-event frozen grading, never touch odds-blind model lock
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results/ufcvegas124_2026-11-07_all_models_grading.json
          git add data/results/ufcvegas124_2026-11-07_top5_verified_settlements.json
          git add data/results/ufcvegas124_2026-11-07_top5_research_unit_grade.json
          git add data/results/clean_ufc_153_2026-11-07.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results: grade 14 Nov7 fights, three winner/method models, 14 timing, 5+5 FanDuel hypothetical and official 153"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
