name: gather-ufc-vegas123-full-stats
on:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/gather_ufcvegas123_full_stats.py"
      - ".github/workflows/gather-ufc-vegas123-full-stats.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gather-ufc-vegas123-full-stats
  cancel-in-progress: true
jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch and validate unpicked Oct31 event source
        run: PYTHONPATH=src python tools/gather_ufcvegas123_full_stats.py
      - name: Save source snapshots and audit
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/ufcvegas123_2026-10-31
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: snapshot unpicked Vegas123 complete UFCStats"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
