name: UFC refreshed regional and identity readiness
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths:
      - "tools/regional_v5_refreshed_inputs.py"
      - "tools/audit_ufc_name_identity.py"
      - ".github/workflows/ufc-regional-refresh-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: |
          mkdir -p .research_cache/fightcanon
          curl --fail --silent --show-error --location --retry 2 --max-time 360 -o .research_cache/fightcanon/canon.db https://github.com/Jadevit/fight-canon-db/releases/download/db-2026-11-19-1934/canon.db
          curl --fail --silent --show-error --location --retry 2 --max-time 360 -o .research_cache/fightcanon/new.db https://github.com/Jadevit/fight-canon-db/releases/download/db-2026-11-24-2118/canon.db
          echo '8185a2163b5f97071dbc4ec68667cceb43f5e321fadc38c26b5069303af4d949  .research_cache/fightcanon/canon.db' | sha256sum -c
          echo 'e7e0a53ff47d336ed961b228e31a1ef98c77129fa9104e82496637e69f3ade29  .research_cache/fightcanon/new.db' | sha256sum -c
      - run: python tools/audit_ufc_name_identity.py
      - run: python tools/audit_worldwide_mma_history_v4.py > /tmp/regional_old_audit.log
      - run: python tools/regional_v5_refreshed_inputs.py
      - name: Verify frozen Qatar predictions
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=json.loads(Path("data/grades/ufcqatar_2026_11_21_all_frozen_models_and_public_card_grade.json").read_text())
          for name,sha in d["frozen_source_hashes"].items():
              p=Path("data/locks/ufcqatar_2026-11-21" if name=="stage_a_final_selection.json" else "data/shadow_locks/ufcqatar_2026-11-21")/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-and-identity-integration
          path: |
            bruno_identity_audit.json
            regional_v5_refresh_integration.json
