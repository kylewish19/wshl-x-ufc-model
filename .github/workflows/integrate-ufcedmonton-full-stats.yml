name: integrate-ufcedmonton-full-stats
on:
  push:
    branches:
      - feature/historical-conditional-rates
    paths:
      - "tools/integrate_ufcedmonton_full_stats.py"
      - "data/results/clean_ufcedmonton_13_2026-10-17.csv"
      - "data/raw/ufcedmonton_2026-10-17/**"
      - ".github/workflows/integrate-ufcedmonton-full-stats.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-ufcedmonton-full-stats
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integrate Edmonton
        run: PYTHONPATH=src python tools/integrate_ufcedmonton_full_stats.py
      - name: Test
        run: pytest -q
      - name: Save
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results/clean_ufc_125_2026-10-17.csv \
            artifacts/v033_ufcedmonton_full_stats \
            reports/v033_ufcedmonton_full_stats \
            artifacts/v034_winner_interactions/winner_v034_experience_shadow_through_2026-10-17.joblib \
            artifacts/v034_winner_interactions/refresh_2026-10-17.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "model: integrate UFC Edmonton full stats into current backbone"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
