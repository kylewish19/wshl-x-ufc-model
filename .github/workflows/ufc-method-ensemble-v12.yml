name: UFC method ensemble v12 research
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths:
      - "src/wshlx_ufc/method_ensemble_v12.py"
      - "tools/benchmark_method_ensemble_v12.py"
      - "tests/test_ufc_method_ensemble_v12.py"
      - ".github/workflows/ufc-method-ensemble-v12.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_ufc_method_ensemble_v12.py
      - uses: actions/download-artifact@v4
        with:
          name: wshlx-nov24-opponent-method-v11
          run-id: 45494717295
          github-token: ${{ github.token }}
          path: .research_cache/v11
      - name: Locate and preserve corrected V11 paired source
        run: |
          mkdir -p reports/model_health/2026-11-24_opponent_method_v11
          find .research_cache/v11 -name opponent_v11_results.json -exec cp {} reports/model_health/2026-11-24_opponent_method_v11/ \;
          find .research_cache/v11 -name opponent_v11_paired_forecasts.csv -exec cp {} reports/model_health/2026-11-24_opponent_method_v11/ \;
      - name: Earlier-year ensemble weights and independent later-year scores
        run: |
          set -o pipefail
          python tools/benchmark_method_ensemble_v12.py | tee ensemble_v12_stdout.log
      - name: Verify original locks unchanged and cohort integrity
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("reports/model_health/2026-11-24_method_ensemble_v12")
          d=json.loads((p/"ensemble_v12_results.json").read_text())
          assert d["winner_fixed"] and d["no_promotion"] and d["retrospective_only"]
          assert d["out_sha256"]==hashlib.sha256((p/"ensemble_v12_forecasts.csv").read_bytes()).hexdigest()
          assert [(v["meta_train_n"],v["test_n"]) for v in d["yearly"].values()]==[(511,513),(1024,488)]
          for v in d["yearly"].values():
              assert len(v["scores"])==10
              assert len({x["winner_hits"] for x in v["scores"].values()})==1
          original=json.loads(Path("data/grades/ufcqatar_2026_11_21_all_frozen_models_and_public_card_grade.json").read_text())
          for name,sha in original["frozen_source_hashes"].items():
              source=Path("data/locks/ufcqatar_2026-11-21" if name=="stage_a_final_selection.json" else "data/shadow_locks/ufcqatar_2026-11-21")/name
              assert hashlib.sha256(source.read_bytes()).hexdigest()==sha
          print("V12_ENSEMBLE_VERIFIED_FROZEN_SOURCES")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wshlx-nov24-method-ensemble-v12
          path: |
            reports/model_health/2026-11-24_method_ensemble_v12/
            ensemble_v12_stdout.log
          if-no-files-found: warn
