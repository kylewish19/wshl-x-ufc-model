name: historical-current-style-oof
on:
  push:
    branches:
      - feature/historical-conditional-rates
    paths:
      - "tools/build_historical_current_style_oof.py"
      - ".github/workflows/historical-current-style-oof.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: historical-current-style-oof
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build causal historical OOF comparison
        run: python tools/build_historical_current_style_oof.py
      - name: Test repository
        run: pytest -q
      - name: Save OOF diagnostic outputs
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/unified/historical_oof \
            reports/historical_oof_contextual_through_2026-10-17
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diagnostic: save causal historical OOF context study"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
