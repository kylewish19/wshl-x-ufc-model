name: integrate-v032-ufcvegas121-full-stats
on:
  push:
    paths:
      - "v032_full_stats_request.json"
      - "tools/integrate_ufcvegas121_full_stats.py"
      - ".github/workflows/integrate-v032-ufcvegas121-full-stats.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-v032-ufcvegas121-full-stats
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integrate
        run: PYTHONPATH=src python tools/integrate_ufcvegas121_full_stats.py
      - name: Test
        run: pytest -q
      - name: Save
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/v032_ufcvegas121_full_stats reports/v032_ufcvegas121_full_stats
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "model: integrate UFC Vegas 121 full stats into v0.32 shadow"
          git pull --rebase origin main
          git push
