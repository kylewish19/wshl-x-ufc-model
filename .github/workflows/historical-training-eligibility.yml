name: historical-training-eligibility
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths:
      - "src/wshlx_ufc/historical_training_eligibility.py"
      - "tools/audit_ufc_2021_2026_training_eligibility.py"
      - "tests/test_ufc_historical_training_eligibility.py"
      - ".github/workflows/historical-training-eligibility.yml"
  workflow_dispatch:
jobs:
  inventory:
    name: Audit 2021-2026 UFC model training population (no fitting)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pinned UFC source and chronology checks
        run: python tools/audit_ufc_2021_2026_training_eligibility.py
      - name: Run model-history training-eligibility regression tests
        run: pytest -q tests/test_ufc_historical_training_eligibility.py
