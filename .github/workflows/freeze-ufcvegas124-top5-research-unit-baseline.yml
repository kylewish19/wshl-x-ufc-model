name: Freeze Vegas124 Top5 hypothetical unit baseline
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "src/wshlx_ufc/research_top5_ledger.py"
      - "tools/track_ufc_top5_research_units.py"
      - ".github/workflows/freeze-ufcvegas124-top5-research-unit-baseline.yml"
permissions:
  contents: write
concurrency:
  group: freeze-vegas124-research-units
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Freeze original FanDuel 5 plus 5 research picks as PENDING virtual-1u ledger
        run: |
          PYTHONPATH=src:tools python tools/track_ufc_top5_research_units.py \
            --card data/locks/ufcvegas124_2026-11-07/stage_b_top5_ranked_research_review_compatible_cross_tier.json \
            --output data/locks/ufcvegas124_2026-11-07/stage_b_top5_research_units_pending.json
      - name: Run all regression tests
        run: pytest -q
      - name: Commit zero-result PENDING baseline; do not imply bets placed
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/locks/ufcvegas124_2026-11-07/stage_b_top5_research_units_pending.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "tracking: freeze 10 FanDuel snapshot prices and 1u hypothetical pending Top5 research ledger"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
