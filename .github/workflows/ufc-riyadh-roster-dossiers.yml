name: UFC Riyadh full roster dossier audit
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths: ["tools/audit_riyadh_roster_dossiers.py",".github/workflows/ufc-riyadh-roster-dossiers.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: |
          mkdir -p .research_cache/fightcanon
          curl --fail --silent --show-error --location --retry 2 --max-time 360 -o .research_cache/fightcanon/new.db https://github.com/Jadevit/fight-canon-db/releases/download/db-2026-11-24-2118/canon.db
      - run: python tools/audit_riyadh_roster_dossiers.py
      - uses: actions/upload-artifact@v4
        with:
          name: riyadh-roster-dossiers
          path: riyadh_roster_dossiers.json
          if-no-files-found: error
