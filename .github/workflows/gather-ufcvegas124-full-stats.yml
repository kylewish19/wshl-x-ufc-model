name: Gather and verify full Nov7 UFCStats round data
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/gather_ufcvegas124_full_stats.py"
      - ".github/workflows/gather-ufcvegas124-full-stats.yml"
permissions:
  contents: write
concurrency:
  group: gather-ufcvegas124-full-stats
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download pinned archived UFCStats Nov8 snapshot and verify all Nov7 fights
        run: python tools/gather_ufcvegas124_full_stats.py
      - name: Run regression tests
        run: pytest -q
      - name: Commit source receipts, all six pinned source CSVs, and verified 14-fight slices
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/ufcvegas124_2026-11-07
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: verified 14 Nov7 UFC bouts and 68 fighter-round UFCStats rows from pinned Nov8 scrape"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
