name: Benchmark Nov7 causal method calibration and submission diagnosis
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/benchmark_ufcvegas124_method_recalibration.py"
      - ".github/workflows/benchmark-ufcvegas124-method-recalibration.yml"
permissions:
  contents: write
concurrency:
  group: benchmark-ufcvegas124-method
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Walk-forward compare raw vs calibrated vs residual vs finish access without same-event leakage
        run: PYTHONPATH=src:tools python tools/benchmark_ufcvegas124_method_recalibration.py
      - name: Run regression tests
        run: pytest -q
      - name: Commit conditional-method benchmark as R&D, not pre-event wager grades
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ufcvegas124_2026-11-07/full_stats/chronological_method_calibration_benchmark.json
          git add reports/ufcvegas124_2026-11-07/full_stats/chronological_method_calibration_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: compare KO-SUB-DEC calibration on 153 causal method feedback rows with chronology; no promotion"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
