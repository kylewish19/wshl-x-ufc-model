name: run-ufc-vegas122-stage-a
on:
  push:
    paths:
      - "tools/run_ufcvegas122_stage_a.py"
      - "tools/run_ufcvegas122_stage_a_audited.py"
      - ".github/workflows/run-ufc-vegas122-stage-a.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Stage A identity audit
        run: PYTHONPATH=src python tools/run_ufcvegas122_stage_a_audited.py
      - name: Test
        run: pytest -q
      - name: Save
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/locks/ufcvegas122_2026-10-10
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "lock: UFC Vegas 122 Stage A identity-audited model"
          git pull --rebase origin main
          git push
