name: gather-ufc331-full-stats

on:
  push:
    paths:
      - "ufc331_stats_request.json"
      - "tools/gather_ufc331_full_stats.py"
      - ".github/workflows/gather-ufc331-full-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gather-ufc331-full-stats
  cancel-in-progress: true

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Gather UFC 331 full stats
        run: PYTHONPATH=src python tools/gather_ufc331_full_stats.py
      - name: Save UFC 331 stats
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add data/raw/ufc331_2026-09-19
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: gather full UFC 331 stats"
          git push
