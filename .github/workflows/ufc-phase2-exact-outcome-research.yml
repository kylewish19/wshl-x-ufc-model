name: UFC phase 2 exact outcomes data audit, ablations and selection

on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths:
      - "tools/research_exact_outcomes_phase2.py"
      - "tests/test_ufc_exact_outcome_phase2.py"
      - ".github/workflows/ufc-phase2-exact-outcome-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests for six-state method and evidence-only selection
        run: pytest -q tests/test_ufc_exact_outcome_phase2.py tests/test_ufc_finish_v1_research.py tests/test_ufc_historical_feature_baselines.py
      - name: Source-audit and chronological 2024-26 paired experiments
        run: python tools/research_exact_outcomes_phase2.py > phase2_stdout.log
      - name: Verify data and predictions before report release
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path("reports/model_health/2026-11-19_exact_outcome_phase2")
          man=json.loads((d/"run_manifest.json").read_text())
          rep=json.loads((d/"phase2_results.json").read_text())
          assert rep["no_model_promoted"]
          assert rep["original_ufcqatar_original_stage_a_and_coherent_lock_unchanged"]
          assert rep["no_code_connected_to_fanduel_bets_or_reference_model"]
          assert all(len(v["models"])==12 for v in rep["folds"].values())
          assert [rep["folds"][y]["evaluation_fights"] for y in
                  ("2024","2025","2026_retrospective")]==[511,513,488]
          for k,file in (("prediction_sha256","out_of_year_six_predictions.csv"),
                         ("report_sha256","phase2_results.json")):
              assert hashlib.sha256((d/file).read_bytes()).hexdigest()==man[k]
          assert all(not any(rep["data_quality"]["unavailable_variable_presence"].values())
                     for _ in range(1))
          print("EXACT_OUTCOME_PHASE2_RESEARCH_PASSED_NO_PROMOTION")
          PY
      - name: Preserve all source and evaluation outputs for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wshlx-phase2-exact-outcome-research
          path: |
            reports/model_health/2026-11-19_exact_outcome_phase2/
            phase2_stdout.log
          if-no-files-found: warn
