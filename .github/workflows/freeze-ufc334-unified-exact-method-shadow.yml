name: Freeze UFC334 Nov14 Unified all 13 exact fighter plus method research forecasts
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/freeze_ufc334_unified_exact_method_research.py"
      - ".github/workflows/freeze-ufc334-unified-exact-method-shadow.yml"
permissions:
  contents: write
concurrency:
  group: freeze-ufc334-unified-exact-method-shadow
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Freeze original Unified 13 method predictions and 12 provided method prices
        run: PYTHONPATH=src:tools python tools/freeze_ufc334_unified_exact_method_research.py
      - name: Run regressions
        run: pytest -q
      - name: Commit separate pending shadow for prospective exact-method grading
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/locks/ufc334_2026-11-14/unified_exact_method_13_picks_12_fanduel_quotes_pending.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: lock 13 unified exact-method picks and 12 FanDuel quoted 1u pending shadows with no bets"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
