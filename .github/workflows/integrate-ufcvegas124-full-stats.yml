name: Integrate Nov7 UFCStats into future-only winner method timing shadows
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/integrate_ufcvegas124_full_stats.py"
      - ".github/workflows/integrate-ufcvegas124-full-stats.yml"
permissions:
  contents: write
concurrency:
  group: integrate-ufcvegas124-full-stats
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integrate verified 68 round stats for future only, train protected research shadows
        run: PYTHONPATH=src:tools python tools/integrate_ufcvegas124_full_stats.py
      - name: Run regression tests
        run: pytest -q
      - name: Commit post-event models and causal snapshots separately from archived pre-event bets
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results/ufcvegas124_2026-11-07_fighter_full_stats.csv
          git add reports/ufcvegas124_2026-11-07/full_stats
          git add artifacts/ufcvegas124_post_event_shadow
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ML: add validated Nov7 stats to future-only shadow training, 153 causal method feedback, no promotion"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
