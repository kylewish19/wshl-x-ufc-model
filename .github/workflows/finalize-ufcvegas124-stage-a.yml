name: Freeze UFC Vegas124 Stage A
on:
  workflow_dispatch:
  push:
    branches: [feature/historical-conditional-rates]
    paths:
      - "tools/finalize_ufcvegas124_stage_a.py"
      - ".github/workflows/finalize-ufcvegas124-stage-a.yml"
permissions:
  contents: write
concurrency:
  group: finalize-ufcvegas124-stage-a
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Freeze odds-blind Stage A before bookmaker prices, pending scale verification
        run: PYTHONPATH=src:tools python tools/finalize_ufcvegas124_stage_a.py
      - name: Test
        run: pytest -q
      - name: Commit frozen lock and audit
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/locks/ufcvegas124_2026-11-07/stage_a_final_selection.json
          git add data/locks/ufcvegas124_2026-11-07/stage_a_final_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "lock: freeze UFC Vegas 124 odds-blind Stage A"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
