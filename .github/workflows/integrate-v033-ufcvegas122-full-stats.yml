name: integrate-v033-ufcvegas122-full-stats
on:
  push:
    paths:
      - "v033_vegas122_full_stats_request.json"
      - "tools/integrate_ufcvegas122_full_stats.py"
      - ".github/workflows/integrate-v033-ufcvegas122-full-stats.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-v033-ufcvegas122-full-stats
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integrate
        run: PYTHONPATH=src python tools/integrate_ufcvegas122_full_stats.py
      - name: Test
        run: pytest -q
      - name: Save
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results/clean_ufc_112_2026-10-10.csv \
            artifacts/v033_ufcvegas122_full_stats \
            reports/v033_ufcvegas122_full_stats \
            artifacts/v034_winner_interactions/winner_v034_experience_shadow_through_2026-10-10.joblib \
            artifacts/v034_winner_interactions/refresh_2026-10-10.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "model: integrate UFC Vegas 122 full stats into v0.33 backbone"
          git pull --rebase origin main
          git push
