name: post-edmonton-expanded-unified
on:
  push:
    branches:
      - feature/historical-conditional-rates
    paths:
      - "scripts/build_unified_ensemble_expanded.py"
      - "data/recovered/**"
      - "data/raw/ufcedmonton_2026-10-17/**"
      - "data/results/clean_ufc_125_2026-10-17.csv"
      - ".github/workflows/post-edmonton-expanded-unified.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post-edmonton-expanded-unified
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Refresh historical conditional models through Edmonton
        run: python scripts/build_historical_model.py --download --min-bin-n 30
      - name: Build expanded unified ensemble
        run: python scripts/build_unified_ensemble_expanded.py
      - name: Test full repository
        run: pytest -q
      - name: Stage historical model bundle
        run: |
          mkdir -p artifacts/historical_conditional_through_2026-10-17
          cp data/historical/historical_winner_model.joblib artifacts/historical_conditional_through_2026-10-17/
          cp data/historical/historical_winner_metrics.json artifacts/historical_conditional_through_2026-10-17/
          cp data/historical/historical_method_model.joblib artifacts/historical_conditional_through_2026-10-17/
          cp data/historical/historical_method_metrics.json artifacts/historical_conditional_through_2026-10-17/
          cp data/historical/historical_timing_model.joblib artifacts/historical_conditional_through_2026-10-17/
          cp data/historical/historical_timing_metrics.json artifacts/historical_conditional_through_2026-10-17/
          cp data/historical/historical_build_manifest.json artifacts/historical_conditional_through_2026-10-17/
          cp data/historical/conditional_win_rates.csv artifacts/historical_conditional_through_2026-10-17/
          cp data/historical/conditional_method_rates.csv artifacts/historical_conditional_through_2026-10-17/
          cp data/historical/conditional_timing_rates.csv artifacts/historical_conditional_through_2026-10-17/
      - name: Save validated post-Edmonton bundle
        run: |
          git config user.name "WSHL_X model bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/historical_conditional_through_2026-10-17 \
            data/unified/expanded_unified_weights.json \
            data/unified/expanded_unified_metrics.json \
            data/unified/expanded_unified_manifest.json \
            data/unified/expanded_unified_winner_predictions.csv \
            data/unified/expanded_unified_method_predictions.csv \
            data/unified/expanded_unified_timing_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "model: refresh historical and expanded unified through Edmonton"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
