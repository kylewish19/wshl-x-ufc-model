name: UFC opponent-adjusted method v11 research
on:
  push:
    branches: ["feature/historical-conditional-rates"]
    paths:
      - "src/wshlx_ufc/opponent_adjusted_method_v11.py"
      - "tools/benchmark_opponent_adjusted_method_v11.py"
      - "tests/test_ufc_opponent_adjusted_method_v11.py"
      - ".github/workflows/ufc-opponent-adjusted-method-v11.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Check past-only round and conversion feature invariants
        run: pytest -q tests/test_ufc_opponent_adjusted_method_v11.py tests/test_ufc_finish_conversion_v9.py
      - name: Retrieve and hash-check the identical worldwide MMA regional source
        run: |
          mkdir -p .research_cache/fightcanon
          curl --fail --silent --show-error --location --retry 2 --max-time 360 --output .research_cache/fightcanon/canon.db https://github.com/Jadevit/fight-canon-db/releases/download/db-2026-11-19-1934/canon.db
          echo '8185a2163b5f97071dbc4ec68667cceb43f5e321fadc38c26b5069303af4d949  .research_cache/fightcanon/canon.db' | sha256sum --check
          python tools/audit_worldwide_mma_history_v4.py > regional_v11_source.log
      - name: Run matched opponent-adjusted method comparison
        run: |
          set -o pipefail
          python tools/benchmark_opponent_adjusted_method_v11.py | tee opponent_v11_stdout.log
      - name: Verify cohort sizes, fixed winners, frozen original sources and forecast integrity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("reports/model_health/2026-11-24_opponent_method_v11")
          a=json.loads((p/"opponent_v11_results.json").read_text())
          assert a["no_model_promotion"] and a["same_v3_winner_probabilities_for_all_arms"]
          assert a["round_source_audit"]["bouts_with_first_two_full_rounds"]>=1000
          assert a["adjustment_audit"]["historical_bouts"]==8871
          assert a["regional_source"]["both_fighters_verified"]==3016
          assert [a["yearly"][y]["test_n"] for y in ("2024","2025","2026_retrospective")]==[511,513,488]
          assert a["forecast_sha256"]==hashlib.sha256((p/"opponent_v11_paired_forecasts.csv").read_bytes()).hexdigest()
          for y in a["yearly"].values():
              assert len(y["scores"])==8
              assert len({v["winner_hits"] for v in y["scores"].values()})==1
          d=json.loads(Path("data/grades/ufcqatar_2026_11_21_all_frozen_models_and_public_card_grade.json").read_text())
          for name,sha in d["frozen_source_hashes"].items():
              source=Path("data/locks/ufcqatar_2026-11-21" if name=="stage_a_final_selection.json" else "data/shadow_locks/ufcqatar_2026-11-21")/name
              assert hashlib.sha256(source.read_bytes()).hexdigest()==sha
          print("OPPONENT_METHOD_V11_VERIFIED_ORIGINAL_LOCKS_UNCHANGED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wshlx-nov24-opponent-method-v11
          path: |
            reports/model_health/2026-11-24_opponent_method_v11/
            opponent_v11_stdout.log
          if-no-files-found: warn
